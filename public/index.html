<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>광고 세팅 요청</title><style>body{font:15px system-ui;background:#f6f7fb;color:#1c2430;margin:0}main{max-width:850px;margin:30px auto;background:white;padding:30px;border-radius:18px;box-shadow:0 6px 35px #16243a12}h1{margin:0 0 8px}label{display:block;font-weight:600;margin:15px 0 6px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ccd2db;border-radius:8px;font:inherit}input[type=checkbox]{width:auto}button{background:#202d4d;color:white;cursor:pointer;margin-top:14px}section{border:1px solid #dce2eb;border-radius:12px;padding:18px;margin-top:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.muted{color:#667085}.hidden{display:none}.check{display:inline-flex;gap:6px;margin-right:18px;align-items:center}#notice{white-space:pre-wrap;padding:12px}a{color:#255bd8}@media(max-width:600px){main{margin:0;padding:18px}.row{grid-template-columns:1fr}}</style><main><h1>광고 세팅 요청</h1><p class="muted">마케터 요청을 매체별로 Notion 제작·세팅 캘린더에 등록합니다.</p><label>팀 비밀번호</label><input id="pw" type="password" autocomplete="off"><div class="row"><div><label>요청자</label><input id="requester" required></div><div><label>호스팅사</label><select id="host"><option>카페24</option><option>아임웹</option><option>스마트스토어</option><option>기타</option></select></div><div><label>업체명</label><input id="company" required></div><div><label>제품명</label><input id="product" required></div></div><label>상품 URL</label><input id="productUrl" type="url" required><label>소재 키워드</label><input id="keyword" required><label>매체 선택 (복수 가능)</label><div id="medias"></div><div id="forms"></div><button id="submit">요청 등록하기</button><div id="notice" role="status"></div><hr><h2>최근 요청</h2><button id="load" type="button">요청 목록 새로고침</button><div id="list"></div></main><script>
const names=['메타','구글','틱톡'],placements={'메타':['피드','스토리','릴스','탐색','검색결과','Audience Network'],'구글':['검색','디스플레이','유튜브','디맨드젠','쇼핑','Gmail'],'틱톡':['TikTok 피드','검색결과','Pangle']};
const el=id=>document.getElementById(id),v=id=>el(id).value,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
el('medias').innerHTML=names.map(m=>'<label class="check"><input type="checkbox" class="media" value="'+m+'">'+m+'</label>').join('');
function fields(m){return '<section id="section-'+m+'"><h2>'+m+' 세팅</h2><label>소재 전달 방식</label><select data-k="assetMethod"><option>URL</option><option>파일 업로드</option></select><div class="asset"><label>소재 URL</label><input data-k="assetUrl" placeholder="https://..."></div><label>캠페인</label><select data-k="campaignType"><option>기존 캠페인</option><option>새 캠페인 (전환캠)</option><option>새 캠페인 (개인캠)</option></select><div class="campaigns"><div class="campaign"><label>기존 캠페인명</label><input data-k="name"><label>세트명</label><input data-k="set"><label>작업 유형</label><select data-k="work"><option>세트 추가</option><option>소재 추가</option><option>세트+소재 추가</option></select></div><button type="button" class="add">기존 캠페인 행 추가</button></div><label>예산</label><select data-k="budget"><option>ABO</option><option>CBO</option><option>소재 추가·예산 변경 없음</option></select><div class="amount"><label>예산 금액 (원)</label><input data-k="amount" type="number" min="0"></div><label>타겟</label><select data-k="target"><option>자동(추천)</option><option>수동</option><option>논타겟</option></select><div class="targetDetail hidden"><label>수동 타겟 상세</label><textarea data-k="targetDetail"></textarea></div><label>매체 지면 (복수 선택)</label>'+placements[m].map(p=>'<label class="check"><input type="checkbox" class="placement" value="'+esc(p)+'">'+esc(p)+'</label>').join('')+'</section>'}
function refresh(){el('forms').innerHTML=names.filter(m=>document.querySelector('.media[value="'+m+'"]').checked).map(fields).join('');el('forms').querySelectorAll('section').forEach(s=>{function sync(){const k=x=>s.querySelector('[data-k="'+x+'"]').value;s.querySelector('.asset').innerHTML=k('assetMethod')==='URL'?'<label>소재 URL</label><input data-k="assetUrl" placeholder="https://...">':'<label>소재 파일</label><input data-k="files" type="file" multiple>';s.querySelector('.campaigns').classList.toggle('hidden',k('campaignType')!=='기존 캠페인');s.querySelector('.amount').classList.toggle('hidden',k('budget').includes('변경 없음'));s.querySelector('.targetDetail').classList.toggle('hidden',k('target')!=='수동')}s.querySelectorAll('select').forEach(x=>x.addEventListener('change',()=>{if(x.dataset.k==='assetMethod'||x.dataset.k==='campaignType'||x.dataset.k==='budget'||x.dataset.k==='target')sync()}));s.querySelector('.add').onclick=()=>{const c=s.querySelector('.campaign');const n=c.cloneNode(true);n.querySelectorAll('input').forEach(i=>i.value='');c.parentNode.insertBefore(n,s.querySelector('.add'))};sync()})}
document.querySelectorAll('.media').forEach(x=>x.onchange=refresh);
el('submit').onclick=async()=>{const media=[...document.querySelectorAll('.media:checked')].map(x=>x.value),settings={},fd=new FormData();for(const m of media){const s=el('section-'+m),get=k=>s.querySelector('[data-k="'+k+'"]')?.value||'',method=get('assetMethod');settings[m]={assetMethod:method,assetUrl:get('assetUrl'),campaignType:get('campaignType'),campaigns:[...s.querySelectorAll('.campaign')].map(c=>({name:c.querySelector('[data-k=name]').value,set:c.querySelector('[data-k=set]').value,work:c.querySelector('[data-k=work]').value})),budget:get('budget'),amount:get('amount'),target:get('target'),targetDetail:get('targetDetail'),placements:[...s.querySelectorAll('.placement:checked')].map(x=>x.value)};if(method==='파일 업로드'){for(const f of s.querySelector('[data-k=files]').files){fd.append('files',new File([f],m+'__'+f.name,{type:f.type}))}}}const payload={requester:v('requester'),host:v('host'),company:v('company'),product:v('product'),productUrl:v('productUrl'),keyword:v('keyword'),media,settings};if(!media.length){el('notice').textContent='매체를 선택해 주세요.';return}fd.append('payload',JSON.stringify(payload));el('notice').textContent='등록 중...';try{const r=await fetch('/api/submit',{method:'POST',headers:{'x-team-password':v('pw')},body:fd}),d=await r.json();if(!r.ok)throw Error(d.error);el('notice').textContent='등록 완료: '+d.created.map(x=>x.media).join(', ')}catch(e){el('notice').textContent='등록 실패: '+e.message}};
el('load').onclick=async()=>{try{const r=await fetch('/api/requests',{headers:{'x-team-password':v('pw')}}),d=await r.json();if(!r.ok)throw Error(d.error);el('list').innerHTML=d.rows.map(x=>'<p><a target="_blank" rel="noopener" href="'+encodeURI(x.url)+'">'+esc(x.title)+'</a> '+esc(x.status||'')+'</p>').join('')||'요청 없음'}catch(e){el('list').textContent=e.message}};
</script></html>
